<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
	<link rel="stylesheet" href="forms_and_events.css" />
    <title>Формы и события</title>
</head>
<!--<body onmousemove="traceMouse(event)">-->
<body class="light">
	<div class="header">
		<div>Header</div>
		<div id="mouse"></div>
		<div id="switch-background-container">
			<div id="debug-background"></div>
			<div>
				<lable for="delay">Delay:</lable>
				<input type="number" min="1" max="8" value="3" id="switch-background-delay" />
			</div>
			<!--<img src="moon.png" id="switch-background"/>-->
			<div id="switch-background"></div>
		</div>
	</div>

	<h1>Формы и события</h1>
	<details>
		<summary>Простейшие задачи</summary>
		<h2>Factorial</h2>
		<div class="task">

			<lable for="number">Введите целое число от 0 до 12</lable>
			<input id="number" type="number" min="0" onchange="Factorial()" placeholder="Введите целое число" />

			<button onclick="Factorial()">Вычислить</button>
		</div>
		<div id="factorial-result" class="result"></div>
		<!--<div id="factorialresult" class="result" type="text"></div>-->
		<hr />
		<h2>Power</h2>
		<div class="task">

		</div>
	</details>

	<!-- -------------------------------------------------------------------------- -->
	<details>
		<summary>Фото и цвета</summary>
		<div class="images-and-colors">
			<div class="upload-image">
				<div class="image-container">
					<img alt="Фото студента" id="image" />
				</div>
				<input type="file" id="image-file" onchange="setImage()" />
			</div>

			<div class="colors">
				<div class="select-color">
					<lable for="background-color">Цвет фона</lable>
					<input type="color" id="background-color" value="#FFFFFF" />
				</div>
				<div class="select-color">
					<lable for="foreground-color">Цвет текста</lable>
					<input type="color" id="foreground-color" />
				</div>
			</div>
		</div>
	</details>

	<details>
		<summary>Дата и время</summary>
		<h2 id="raw-date"></h2>
		<div id="clock">
			<h2>Time</h2>
			<div id="current-time">
				<span id="hours"></span>:<span id="minutes"></span>:<span id="seconds"></span>
			</div>
			<div id="current-date">
				<span id="years"></span>.<span id="months"></span>.<span id="days"></span>
			</div>
			<div id="day-of-week"></div>
			<div id="clock-controls" class="clock-controls">
				<div><input type="checkbox" id="show-date" /><lable for="show-date">Показать дату</lable></div>
				<div><input type="checkbox" id="show-weekday" /><lable for="show-weekday">Показать день недели</lable></div>
			</div>
		</div>
	</details>

	<!-- -------------------------------------------------------------------------- -->
	<div id="countdown-timer">
		<h2>Countdown timer</h2>
		<input type="date" id="target-date" value="2026-08-01"/>
		<input type="time" id="target-time" value="22:00"/>
		<input type="button" id="btn-start" value="Start"/>
	</div>
	<div id="debug">
		<div id="target-date-value" ></div>
		<div id="target-time-value" ></div>
		<div id="current-time-value"></div>
		<div id="timezone"></div>
		<div id="duration"></div>
		<div id="timestamp"></div>
	</div>
	<div id="display">
		<div class="time-block">
			<div id="hours-unit" class="time-unit"></div>
			<div id="hours-marker" class="time-marker">Hours</div>
		</div>
		<div class="time-block">
			<div id="minutes-unit" class="time-unit"></div>
			<div id="minutes-marker" class="time-marker">Minutes</div>
		</div>
		<div class="time-block">
			<div id="seconds-unit" class="time-unit"></div>
			<div id="seconds-marker" class="time-marker">Seconds</div>
		</div>
	</div>
	<script src="forms_and_events.js"></script>
</body>
</html>
