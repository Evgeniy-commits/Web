<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css"/>
</head>
<body>
	<div class="main-window" id="calcWindow">
		<div class="title-bar" id="titlebar">
			<div class="title-bar-left-side">
				<img src="CalcXP.ico" class="app-icon" />
				<div>&#8211 Калькулятор</div>
			</div>
			<div class="title-bar-right-side">
				<button class="control-button">				<div class="control-button-signature" style="margin-left: -4px;">&#x1F5D5;</div></button>
				<button class="control-button" disabled>	<div class="control-button-signature">&#128470;</div></button>
				<button class="control-button close-button" id="closeBtn"><div class="control-button-signature close-button-signature">&#10006; </div></button>
			</div>
        </div>
        <!-- --------------------------------------------------------------------------------------------- -->
		<div class="client-rect">
			<div class="work-area">
				<div class="menu-bar">
					<button class="menu-button">Правка</button>
					<button class="menu-button">Вид</button>
					<button class="menu-button">Справка</button>
				</div>
				<div class="display-container">
					<input type="text" class="display" id="display" readonly value="0"/>
				</div>
        <!-- --------------------------------------------------------------------------------------------- -->

				<div class="calc-buttons">
					<div class="square"></div>
					<div class="clear-buttons">
						<button id="btn-backspace">Backspace</button>
						<button id="btn-ce">CE</button>
						<button id="btn-c">C</button>
					</div>
					
					<button class="memory-button">MC</button>
					<button>7</button>
					<button>8</button>
					<button>9</button>
					<button class="operation-button">/</button>
					<button>sqrt</button>

					<button class="memory-button">MR</button>
					<button>4</button>
					<button>5</button>
					<button>6</button>
					<button class="operation-button">*</button>
					<button>%</button>

					<button class="memory-button">MS</button>
					<button>1</button>
					<button>2</button>
					<button>3</button>
					<button class="operation-button">-</button>
					<button data-action="rec">1/x</button>

					<button class="memory-button">M+</button>
					<button>0</button>
					<button>+/-</button>
					<button>.</button>
					<button class="operation-button">+</button>
					<button class="operation-button">=</button>
				</div>				
			</div>
        </div>
		<script src="calc.js"></script>
	</div>
</body>
</html>
